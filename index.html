<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyTrust - DApp Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: #fafafa; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        #walletStatus { font-weight: bold; color: #e74c3c; margin-bottom: 15px; }
        .result-box { background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>SupplyTrust DApp Tracker</h1>
    <div id="walletStatus">Wallet Status: Not Connected</div>
    <button id="connectWalletBtn" onclick="connectWallet()">Connect MetaMask</button>

    <div class="card">
        <h3>Register Product (Owner Only)</h3>
        <label>Product ID:</label>
        <input type="number" id="regId" placeholder="e.g. 101">
        <label>Product Name:</label>
        <input type="text" id="regName" placeholder="e.g. Organic Coffee Beans">
        <label>Manufacturer Name:</label>
        <input type="text" id="regManufacturer" placeholder="e.g. AgroCorp Ltd">
        <button onclick="registerProduct()">Register Product</button>
    </div>

    <div class="card">
        <h3>Update Product Status (Owner Only)</h3>
        <label>Product ID:</label>
        <input type="number" id="updateId" placeholder="e.g. 101">
        <label>New Status:</label>
        <select id="updateStatusVal">
            <option value="0">Manufactured</option>
            <option value="1">Shipped</option>
            <option value="2">Out For Delivery</option>
            <option value="3">Delivered</option>
        </select>
        <button onclick="updateStatus()">Update Status</button>
    </div>

    <div class="card">
        <h3>Verify / Retrieve Product Data</h3>
        <label>Product ID:</label>
        <input type="number" id="verifyId" placeholder="e.g. 101">
        <button onclick="verifyProduct()">Fetch Details</button>
        <div id="productResult" class="result-box" style="display:none;"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
